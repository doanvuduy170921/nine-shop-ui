name: CI/CD Frontend Enterprise Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Angular Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/doanvuduy170921/nines-shop-ui:latest

  deploy-ui:
    needs: build-ui
    runs-on: self-hosted
    steps:
      - name: Pull latest UI image and update via Docker Compose
        run: |
          cd /home/runner/actions-runner/actions-runner/_work/nines-shop/nines-shop/infra

          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin


          docker compose -f docker-compose.prod.yml pull frontend
          docker compose -f docker-compose.prod.yml up -d --no-deps frontend

          docker image prune -f
