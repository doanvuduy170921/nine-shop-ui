
<!-- Login Section -->
<section id="login" class="login section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="auth-container">

          <!-- Login Form -->
          <div class="auth-form login-form active">
            <div class="form-header">
              <h3>Welcome Back</h3>
              <p>Sign in to your account</p>
            </div>

            <!-- FORM LOGIN -->
            <!-- Login Form -->
            <form class="auth-form-content" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              <div class="input-group mb-3">
                <span class="input-icon"><i class="bi bi-envelope"></i></span>
                <input
                  type="email"
                  class="form-control"
                  formControlName="email"
                  placeholder="Email address"
                  [class.is-invalid]="email?.invalid && email?.touched">
                <!-- Thêm validation message (optional) -->
                <div class="invalid-feedback" *ngIf="email?.invalid && email?.touched">
                  <span *ngIf="email?.errors?.['required']">Email is required</span>
                  <span *ngIf="email?.errors?.['email']">Invalid email format</span>
                </div>
              </div>

              <div class="input-group mb-3">
                <span class="input-icon"><i class="bi bi-lock"></i></span>
                <input
                  type="password"
                  class="form-control"
                  formControlName="password"
                  placeholder="Password"
                  [class.is-invalid]="password?.invalid && password?.touched">
                <!-- Thêm validation message (optional) -->
                <div class="invalid-feedback" *ngIf="password?.invalid && password?.touched">
                  <span *ngIf="password?.errors?.['required']">Password is required</span>
                  <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
                </div>
              </div>

              <button
                type="submit"
                class="auth-btn primary-btn mb-3"
                [disabled]="isLoading || loginForm.invalid">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading">Signing in...</span>
                <i class="bi bi-arrow-right" *ngIf="!isLoading"></i>
              </button>

              <p *ngIf="errorMessage" class="text-danger text-center">{{ errorMessage }}</p>
            </form>

            <div class="divider"><span>or</span></div>

            <button type="button" class="auth-btn social-btn">
              <i class="bi bi-google"></i>
              Continue with Google
            </button>

            <div class="switch-form">
              <span>Don't have an account?</span>
              <button type="button" class="switch-btn" routerLink="/register-user">Create account</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
