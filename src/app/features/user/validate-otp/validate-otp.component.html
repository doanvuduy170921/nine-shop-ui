<app-header></app-header>

<section id="otp-verify" class="login section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="auth-container">

          <!-- OTP Verification Form -->
          <div class="auth-form otp-form active">
            <div class="form-header">
              <div class="otp-icon" [class.verified]="isVerified">
                <i class="bi" [class.bi-envelope-check]="!isVerified" [class.bi-check-circle-fill]="isVerified"></i>
              </div>
              <h3>{{ isVerified ? 'Verified!' : 'Verify Your Email' }}</h3>
              <p *ngIf="!isVerified">We've sent a verification code to</p>
              <p class="email-display">{{ userEmail }}</p>
            </div>

            <!-- OTP Form -->
            <form class="auth-form-content" [formGroup]="otpForm" (ngSubmit)="onVerifyOtp($event)">

              <!-- OTP Input Fields -->
              <div class="otp-input-group">
                <input
                  #otp1
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit1"
                  (input)="onInput($event, 1)"
                  (keydown)="onKeyDown($event, 1)"
                  (paste)="onPaste($event)"
                  [disabled]="isLoading || isVerified">

                <input
                  #otp2
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit2"
                  (input)="onInput($event, 2)"
                  (keydown)="onKeyDown($event, 2)"
                  [disabled]="isLoading || isVerified">

                <input
                  #otp3
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit3"
                  (input)="onInput($event, 3)"
                  (keydown)="onKeyDown($event, 3)"
                  [disabled]="isLoading || isVerified">

                <input
                  #otp4
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit4"
                  (input)="onInput($event, 4)"
                  (keydown)="onKeyDown($event, 4)"
                  [disabled]="isLoading || isVerified">

                <input
                  #otp5
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit5"
                  (input)="onInput($event, 5)"
                  (keydown)="onKeyDown($event, 5)"
                  [disabled]="isLoading || isVerified">

                <input
                  #otp6
                  type="text"
                  maxlength="1"
                  class="otp-input"
                  formControlName="digit6"
                  (input)="onInput($event, 6)"
                  (keydown)="onKeyDown($event, 6)"
                  [disabled]="isLoading || isVerified">
              </div>

              <!-- Error Message -->
              <p *ngIf="errorMessage" class="text-danger text-center mt-3">
                <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
              </p>

              <!-- Success Message -->
              <p *ngIf="isVerified" class="text-success text-center mt-3">
                <i class="bi bi-check-circle-fill"></i> OTP verified successfully! Redirecting...
              </p>

              <!-- Verify Button -->
              <button
                type="submit"
                class="auth-btn primary-btn mt-4"
                [disabled]="isLoading || isVerified || otpForm.invalid">
                <span *ngIf="!isLoading && !isVerified">Verify Code</span>
                <span *ngIf="isLoading">Verifying...</span>
                <span *ngIf="isVerified"><i class="bi bi-check-circle"></i> Verified</span>
              </button>

              <!-- Back to Checkout -->
              <div class="switch-form">
                <button type="button" class="switch-btn" routerLink="/checkout">
                  <i class="bi bi-arrow-left"></i> Back to Checkout
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer></app-footer>
